[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-contract-0910031-009"
version = "0.2.0"
description = "执业资质范围核验：领域契约、规则引擎、核验案件与授权原子写入后端"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
qualification-verifier = "qualification_verifier.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
